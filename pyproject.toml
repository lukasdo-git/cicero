[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "cicero"
description = "A Discord bot for managing and auditing your k3s cluster"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "discord.py"
]
authors = [
  {name = "Dominik Łukasiewicz", email = "lukasiewiczd090@gmail.com"}
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.2",
    "mypy==2.3.0",
    "pytest",
    "pre-commit"
]
